[project]
name = "wc22-analysis"
version = "0.1.0"
description = "Download, model and analyze StatsBomb's 2022 FIFA World Cup data with Python, DuckDB and SQL."
readme = "README.md"
authors = [
    { name = "Rodrigo Rosales", email = "rodrigo.rosales.c@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "requests>=2.34.2",
]

[project.scripts]
wc22-analysis = "wc22_analysis:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
