[project]
name = "football-scouting"
version = "0.1.0"
description = "Scouting tool on StatsBomb event data and Transfermarkt market values: player profiles, similar players and market value. Python, DuckDB, SQL."
readme = "README.md"
authors = [
    { name = "Rodrigo Rosales", email = "rodrigo.rosales.c@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.1",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.6",
    "sqlfluff>=4.5.0",
]
